<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root { --bg: #0d1117; --fg: #f6f3ee; }
    @media (prefers-color-scheme: dark) { :root { --bg: #e4ebe7; --fg: #0a1010; } }
    rect { fill: var(--bg); }
    text { fill: var(--fg); }
  </style>
  <rect width="32" height="32" rx="5"/>
  <text
    x="16" y="16"
    font-family="ui-monospace, 'IBM Plex Mono', 'Cascadia Code', monospace"
    font-size="13"
    font-weight="700"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="0">RY</text>
</svg>
